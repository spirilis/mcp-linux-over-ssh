{{- if .Values.gateway.enabled }}
{{- $fullname := include "mcp-linux-over-ssh.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "mcp-linux-over-ssh.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}
  hostnames:
    - {{ .Values.host | quote }}
  # Only the MCP endpoint. The probes and anything else the pod answers stay
  # inside the cluster.
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp
      backendRefs:
        - name: {{ $fullname }}
          port: {{ include "mcp-linux-over-ssh.servicePort" . }}
{{- end }}
