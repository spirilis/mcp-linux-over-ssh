{{- /*
With the pod serving TLS itself, the Gateway must originate TLS to it. The
BackendTLSPolicy API version depends on the Gateway API release installed:
gateway.networking.k8s.io/v1 from v1.4, v1alpha3 in v1.3.
*/ -}}
{{- if and .Values.gateway.enabled .Values.gateway.backendTLS.enabled }}
apiVersion: {{ .Values.gateway.backendTLS.apiVersion }}
kind: BackendTLSPolicy
metadata:
  name: {{ include "mcp-linux-over-ssh.fullname" . }}
  labels:
    {{- include "mcp-linux-over-ssh.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ include "mcp-linux-over-ssh.fullname" . }}
      sectionName: https
  validation:
    hostname: {{ .Values.gateway.backendTLS.hostname | default (include "mcp-linux-over-ssh.serviceHost" .) | quote }}
    {{- with .Values.gateway.backendTLS.caCertificateRefs }}
    caCertificateRefs:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- with .Values.gateway.backendTLS.wellKnownCACertificates }}
    wellKnownCACertificates: {{ . }}
    {{- end }}
{{- end }}
